  <!-- ── ARM PLAYING FIELDS ───────────────────────────────────────────────── -->

  <!-- T0 arm: (90,121.547) (130,121.547) (130,191.547) (90,191.547) -->
  <polygon points="90,121.547 130,121.547 130,191.547 90,191.547"
           fill="#2a4a2a" stroke="#3a6a3a" stroke-width="0.3"/>

  <!-- T1 arm: (130,121.547) (110,86.906) (170.622,51.906) (190.622,86.547) -->
  <polygon points="130,121.547 110,86.906 170.622,51.906 190.622,86.547"
           fill="#2a2a4a" stroke="#3a3a6a" stroke-width="0.3"/>

  <!-- T2 arm: (110,86.906) (90,121.547) (29.378,86.547) (49.378,51.906) -->
  <polygon points="110,86.906 90,121.547 29.378,86.547 49.378,51.906"
           fill="#2a4a3a" stroke="#3a6a4a" stroke-width="0.3"/>

  <!-- ── CENTER TRIANGLE ──────────────────────────────────────────────────── -->
  <!-- Vertices: T0-left=(90,121.547), T0-right=(130,121.547), T1/T2=(110,86.906) -->
  <polygon points="90,121.547 130,121.547 110,86.906"
           fill="#3a5a3a" stroke="#5a8a5a" stroke-width="0.3"/>

  <!-- ── CREATURE CHANNEL POLYGONS (dashed outlines) ────────────────────── -->

  <!-- T0 channel (red): 8 points -->
  <polygon points="80,121.547 80,171.547 140,171.547 140,121.547 130,121.547 130,161.547 90,161.547 90,121.547"
