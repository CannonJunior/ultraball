  <line x1="22" y1="191" x2="30" y2="191" stroke="#3b82f6" stroke-width="0.9" stroke-dasharray="3,1.5"/>
  <text x="32" y="192.5" font-size="3" fill="#93c5fd" font-family="sans-serif">T1 channel</text>
  <line x1="22" y1="199" x2="30" y2="199" stroke="#34d399" stroke-width="0.9" stroke-dasharray="3,1.5"/>
  <text x="32" y="200.5" font-size="3" fill="#6ee7b7" font-family="sans-serif">T2 channel</text>
