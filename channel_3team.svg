  <rect x="22" y="154" width="8" height="5" fill="rgba(239,68,68,0.4)"   stroke="#ef4444" stroke-width="0.4"/>
  <text x="32" y="158.5" font-size="3" fill="#fca5a5" font-family="sans-serif">T0 endzone</text>
  <rect x="22" y="162" width="8" height="5" fill="rgba(59,130,246,0.4)"  stroke="#3b82f6" stroke-width="0.4"/>
  <text x="32" y="166.5" font-size="3" fill="#93c5fd" font-family="sans-serif">T1 endzone</text>
  <rect x="22" y="170" width="8" height="5" fill="rgba(52,211,153,0.4)"  stroke="#34d399" stroke-width="0.4"/>
