    <line x1="18" y1="80"  x2="206" y2="80"/>
    <line x1="18" y1="100" x2="206" y2="100"/>
    <line x1="18" y1="120" x2="206" y2="120"/>
    <line x1="18" y1="140" x2="206" y2="140"/>
    <line x1="18" y1="160" x2="206" y2="160"/>
    <line x1="18" y1="180" x2="206" y2="180"/>
    <line x1="18" y1="200" x2="206" y2="200"/>
    <line x1="20"  y1="42" x2="20"  y2="207"/>
    <line x1="40"  y1="42" x2="40"  y2="207"/>
    <line x1="60"  y1="42" x2="60"  y2="207"/>
    <line x1="80"  y1="42" x2="80"  y2="207"/>
    <line x1="100" y1="42" x2="100" y2="207"/>
    <line x1="110" y1="42" x2="110" y2="207"/>
    <line x1="120" y1="42" x2="120" y2="207"/>
