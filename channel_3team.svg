  <text x="152"   y="59.5"  font-size="2.8" fill="#93c5fd" text-anchor="end" font-family="monospace">(153.3,61.9)</text>
  <text x="169.5" y="50"    font-size="2.8" fill="#93c5fd" text-anchor="end" font-family="monospace">(170.6,51.9)</text>
