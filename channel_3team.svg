  <text x="40.5"  y="103"   font-size="2.8" fill="#6ee7b7" text-anchor="end" font-family="monospace">3:(41.7,105.2)</text>
  <text x="84"    y="132.5" font-size="2.8" fill="#6ee7b7" text-anchor="end" font-family="monospace">4:(85,130.2)</text>
  <text x="54"    y="99.5"  font-size="2.8" fill="#6ee7b7" text-anchor="end" font-family="monospace">6:(55.4,101.5)</text>
