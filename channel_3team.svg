    <circle cx="80"   cy="171.547" r="1.3"/>
    <circle cx="140"  cy="171.547" r="1.3"/>
    <circle cx="140"  cy="121.547" r="1.3"/>
    <circle cx="130"  cy="121.547" r="1.3"/>
    <circle cx="130"  cy="161.547" r="1.3"/>
